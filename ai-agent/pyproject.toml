[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[project]
name = "v-energy-grid-genai"
version = "0.1.0"
description = "Serviço GenAI do V-Energy Grid 360"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.30,<3.0"]
groq = ["httpx>=0.27,<1.0"]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: chama um provedor real; opt-in via GENAI_RUN_LIVE_SMOKE=1, fora do CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
