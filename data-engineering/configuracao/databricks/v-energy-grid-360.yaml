# V-Energy Grid 360 — Workflow do pipeline (Módulo 1: Engenharia de Dados).
#
# Este arquivo é a definição do job `v-energy-grid-360`, como o Databricks a exporta
# da aba YAML do job, mais os comentários de porquê. Ele não é um bundle instalável
# (isso exigiria a CLI do Databricks e um `databricks.yml` na raiz); é o registro
# versionado do Workflow, no lugar que o documento de entrega pede
# (`data-engineering/notebook/`: notebooks `.ipynb`; YAML em `data-engineering/configuracao/databricks/`).
# Os caminhos são os do Workspace de origem (`pipeline_v2`); ajuste-os para o seu Workspace.
#
# Encadeamento: Landing_to_Bronze -> Bronze_perfilamento -> Bronze_to_Silver -> Cobertura_Declaracao -> Silver_to_gold -> Exportacao_Gold.
# Cobertura_Declaracao confere Bronze, Silver e totais do lote ativo e entrega à Gold, por task values, a declaração de
# cobertura e as janelas de preço x volume. Como a declaração é amarrada ao run da Silver, ela precisa ser gerada
# depois de cada Silver nova; se uma conferência não fechar, a tarefa falha e a Gold não roda.
# A ordem não é decorativa: o perfilador lê as tabelas que a ingestão acabou de
# gravar, a Silver lê o lote ativo da Bronze e exige o perfil, e a Gold lê apenas
# as vistas publicadas da Silver (`silver_publicada.*`).
# Exportacao_Gold (DE-06) lê as quinze tabelas analíticas da Gold e o cadastro restrito e grava um CSV por tabela, cada uma em
# diretório próprio, em uma pasta exclusiva por tentativa no Volume `workspace.gold.gold_export_volume` (o cadastro vai para
# o Volume restrito `workspace.gold_cadastro.cadastro_export_volume`), sem sobrescrever exportações anteriores. Antes de
# gravar, exige que a última execução CONCLUIDO de `gold.controle_gold` seja de ambiente
# `prod`; ao final, grava o `manifest.json` com a linhagem (Gold, Silver e lote Bronze).
# Não recebe parâmetros e não carrega o banco local (essa carga é uma etapa separada).
#
# Correspondência com os notebooks versionados em `data-engineering/notebook/`:
#   Landing_to_Bronze   -> Landing_to_Bronze.ipynb
#   Bronze_perfilamento -> Bronze_perfilamento.ipynb
#   Bronze_to_Silver    -> Bronze_to_Silver.ipynb
#   Cobertura_Declaracao -> Cobertura_Declaracao.ipynb
#   Silver_to_gold      -> Silver_to_gold.ipynb   (no Workspace, `Silver_to_Gold`)
#   Exportacao_Gold     -> Exportacao_Gold_SQLite.ipynb
#
# Cadastro restrito: a Gold exige `CADASTRO_RESTRITO_VALIDADO: sim`, declaração do operador de que os schemas
# `gold_cadastro` e `gold_cadastro_preparo`, o Volume `gold_cadastro.cadastro_export_volume` e as permissões
# estão provisionados. Sem isso a tarefa para antes de gravar. A declaração de cobertura (JSON com contagens) NUNCA
# é escrita neste arquivo: ela vem do task value da tarefa Cobertura_Declaracao.
#
# Ambiente da Gold: o notebook `Silver_to_gold` exige o parâmetro `AMBIENTE` (dev, test ou
# prod), sem valor padrão. A tarefa passa `AMBIENTE: prod`. Em `prod`, a Gold só conclui
# se a Silver tiver linhagem física e status CONCLUIDO, e a execução fica registrada em
# `gold.controle_gold` com o ambiente.
#
# Estratégia de agendamento (proposta; NÃO ativada neste momento): mensal, dia 5, às 03:00
# (America/Recife).
#   - o insumo é mensal por natureza: leituras e faturas são por competência,
#     então rodar mais de uma vez no mês não traria dado novo, só custo;
#   - o dia 5 dá folga para o fechamento da competência anterior chegar íntegro;
#   - reexecutar é seguro: a Bronze é carregada por sobrescrita e reconciliada em
#     `bronze.reconciliacao` com `delta = 0`, então um rerun reconstrói o mesmo
#     resultado em vez de duplicar linhas. Essa idempotência é exatamente o
#     motivo de carregar com overwrite e não com append;
#   - alternativa considerada e descartada: gatilho de chegada de arquivo no
#     Volume (`On file arrival`). É fiel ao "chegou dado, roda", mas no Dataset os
#     arquivos entram em lote — cada chegada dispararia uma execução. O
#     agendamento dispara uma vez, no dia combinado, e a carga idempotente faz o
#     resto. (Se a origem passar a depositar arquivo solto, este é o caminho.)
#   - não aplicar a sugestão automática "On table update" do Databricks: a própria Silver
#     atualiza as tabelas de controle, e o Job dispararia a si mesmo.
resources:
  jobs:
    v_energy_grid_360:
      name: v-energy-grid-360
      # Agendamento desativado até decisão do time (o Job real não tem gatilho):
      # schedule:
      #   quartz_cron_expression: "29 0 3 5 * ?"
      #   timezone_id: America/Recife
      #   pause_status: UNPAUSED
      tasks:
        - task_key: Landing_to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Landing_to_Bronze
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Bronze_perfilamento
          depends_on:
            - task_key: Landing_to_Bronze
          # A UI mostra como "Run if dependencies = All succeeded". O export do
          # Databricks não repete esta linha porque é o comportamento padrão —
          # escrita aqui para a garantia não depender da memória de quem lê.
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Bronze_perfilamento
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Bronze_to_Silver
          depends_on:
            - task_key: Bronze_perfilamento
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Bronze_to_Silver
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Cobertura_Declaracao
          depends_on:
            - task_key: Bronze_to_Silver
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Cobertura_Declaracao
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Silver_to_gold
          depends_on:
            - task_key: Cobertura_Declaracao
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Silver_to_Gold
            base_parameters:
              AMBIENTE: prod
              CADASTRO_RESTRITO_VALIDADO: "sim"
              COBERTURA_INICIO: "{{tasks.Cobertura_Declaracao.values.cobertura_inicio}}"
              COBERTURA_FIM: "{{tasks.Cobertura_Declaracao.values.cobertura_fim}}"
              COBERTURA_DECLARACOES_JSON: "{{tasks.Cobertura_Declaracao.values.declaracao_json}}"
              PRECO_VOLUME_INICIO_P0: "{{tasks.Cobertura_Declaracao.values.pv_inicio_p0}}"
              PRECO_VOLUME_FIM_P0: "{{tasks.Cobertura_Declaracao.values.pv_fim_p0}}"
              PRECO_VOLUME_INICIO_P1: "{{tasks.Cobertura_Declaracao.values.pv_inicio_p1}}"
              PRECO_VOLUME_FIM_P1: "{{tasks.Cobertura_Declaracao.values.pv_fim_p1}}"
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: Exportacao_Gold
          depends_on:
            - task_key: Silver_to_gold
          run_if: ALL_SUCCESS
          # No Job real esta tarefa não tem `min_retry_interval_millis` nem
          # `disable_auto_optimization`, que as quatro anteriores têm.
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/pipeline_v2/Exportacao_Gold_SQLite
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED