# Desenvolvimento explícito; a fonte continua sendo Gold v2.
services:
  backend:
    environment:
      APP_ENV: development
    command: [uvicorn, app.main:app, --host, "0.0.0.0", --port, "8000", --reload]
    volumes:
      - ./backend:/app
  frontend:
    build:
      dockerfile: frontend/Dockerfile.dev
    environment:
      VITE_API_URL: /
      API_PROXY_TARGET: http://backend:8000
      DEV_USE_POLLING: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
