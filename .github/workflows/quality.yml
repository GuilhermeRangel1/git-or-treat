name: CI de qualidade do repositório

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualidade-genai:
    name: CI GenAI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ai-agent

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-agent/pyproject.toml

      - name: Instalar dependências de desenvolvimento
        id: deps
        run: python -m pip install -e ".[dev]"

      - name: Preparar relatórios de teste
        run: mkdir -p reports

      - name: Executar testes
        run: python -m pytest -q --junitxml=reports/junit-genai.xml

      - name: Validar compilação e lint
        run: |
          python -m compileall -q app tests
          python -m ruff check .

      - name: Gerar regressão sintética
        if: always() && steps.deps.outcome == 'success'
        run: python -m tests.test_genai_regression --output reports/synthetic-regression-report.json

      - name: Publicar relatórios GenAI
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genai-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai-agent/reports/
          if-no-files-found: ignore
          retention-days: 14

  qualidade-backend:
    name: CI Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: venergy_test
          POSTGRES_PASSWORD: venergy_test
          POSTGRES_DB: v_energy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venergy_test -d v_energy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://venergy_migrator:venergy_migrator@localhost:5432/v_energy_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Preparar usuário de migração sem superusuário no banco efêmero
        env:
          PGPASSWORD: venergy_test
        run: psql --host localhost --port 5432 --username venergy_test --dbname v_energy_test --file scripts/prepare_test_postgres.sql

      - name: Executar testes e verificar drift entre modelos e migrações
        run: python -m pytest -q

      - name: Validar compilação Python
        run: python -m compileall -q app tests scripts

      - name: Autenticar no registry DHI quando configurado
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -n "$DHI_USERNAME" ] && [ -n "$DHI_TOKEN" ]; then
            printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
          fi

      - name: Construir imagem Docker Hardened do backend
        working-directory: .
        run: docker build --pull -f backend/Dockerfile -t venergy-backend:ci .

      - name: Validar dependências e testes na imagem Docker Hardened
        run: |
          docker run --rm venergy-backend:ci python -m pip check
          docker run --rm --network host \
            -e TEST_POSTGRES_URL \
            venergy-backend:ci python -m pytest -q

  qualidade-frontend:
    name: CI Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Python para testar hooks Antigravity
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Testar hooks pelo CLI do adaptador Antigravity
        run: python -m unittest discover -s ../.hooks/tests -v

      - name: Executar lint
        run: npm run lint

      - name: Verificar arquitetura, formatação e testes do frontend
        run: |
          npm run check:boundaries
          npm run format:check
          npm test
          npm run test:proxy

      - name: Validar tipos e build
        run: npm run build

  validar-documentacao-e-configuracao:
    name: CI Documentação e configuração
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar actionlint com versão e checksum fixos
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: Validar workflows do GitHub Actions
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Validar documentação e configurações dos agentes
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import unquote

          root = Path.cwd()

          for name in (
              ".codex/hooks.json",
              ".claude/settings.json",
              ".mcp.json",
              ".agents/hooks.json",
              ".agents/mcp_config.json",
          ):
              json.loads((root / name).read_text(encoding="utf-8"))

          antigravity_mcp = json.loads(
              (root / ".agents/mcp_config.json").read_text(encoding="utf-8")
          )["mcpServers"]
          for name, server in antigravity_mcp.items():
              if "url" in server:
                  raise SystemExit(
                      f"Antigravity MCP {name} usa `url`; conexões remotas exigem `serverUrl`."
                  )
              if not ("command" in server or "serverUrl" in server):
                  raise SystemExit(f"Antigravity MCP {name} sem transporte configurado.")

          tomllib.loads((root / ".codex/config.toml").read_text(encoding="utf-8"))

          instructions = [root / "CLAUDE.md"]
          instructions.extend(root / area / "CLAUDE.md" for area in (
              "frontend", "backend", "data-engineering", "ai-agent", "docs"
          ))
          for instruction in instructions:
              if "@AGENTS.md" not in instruction.read_text(encoding="utf-8"):
                  raise SystemExit(f"Import @AGENTS.md ausente: {instruction.relative_to(root)}")
              if not (instruction.parent / "AGENTS.md").is_file():
                  raise SystemExit(f"AGENTS.md importado nao encontrado: {instruction.relative_to(root)}")

          markdown_files = [
              path for path in root.rglob("*.md")
              if not any(part in {".git", ".agents", ".claude"} for part in path.relative_to(root).parts)
          ]
          broken_links = []
          link_pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)")
          for document in markdown_files:
              content = document.read_text(encoding="utf-8")
              for target in link_pattern.findall(content):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  local_path = unquote(target.split("#", 1)[0])
                  if local_path and not (document.parent / local_path).exists():
                      broken_links.append(f"{document.relative_to(root)} -> {target}")

          if broken_links:
              raise SystemExit("Links locais quebrados:\n- " + "\n- ".join(broken_links))

          print(f"Configuracoes validas; {len(instructions)} imports Claude/Codex presentes; links locais verificados em {len(markdown_files)} documentos.")
          PY

      - name: Validar sintaxe dos hooks compartilhados e adaptador Antigravity
        run: python -m compileall -q .hooks .agents/run_hook.py

  qualidade-docker-compose:
    name: CI Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Autenticar no registry DHI quando configurado
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -n "$DHI_USERNAME" ] && [ -n "$DHI_TOKEN" ]; then
            printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
          fi

      - name: Criar configuração local descartável para o Compose
        run: |
          cp .env.db.example .env.db
          cp backend/.env.example backend/.env

      - name: Validar configuração do Compose
        run: docker compose config --quiet

      - name: Subir os serviços
        run: docker compose up --build --detach

      - name: Verificar portal, proxy, API e banco
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:5173/ | grep --quiet '<div id="root"></div>'

          response_file="$RUNNER_TEMP/compose-health.json"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --retry-connrefused \
              http://localhost:5173/api/v1/health --output "$response_file"; then
              if python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if data["status"] == "online" and data["database"] == "connected" else 1)' "$response_file"; then
                exit 0
              fi
            fi
            if (( attempt < 30 )); then
              sleep 2
            fi
          done
          cat "$response_file"
          exit 1

      - name: Mostrar logs do Compose em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar serviços e remover o banco efêmero
        if: always()
        run: docker compose down --volumes --remove-orphans
