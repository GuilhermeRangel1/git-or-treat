services:
  ai-agent:
    environment:
      GENAI_MODEL_CACHE_TTL_SECONDS: ${GENAI_MODEL_CACHE_TTL_SECONDS:-120}
      GENAI_MODEL_CACHE_MAX_ENTRIES: ${GENAI_MODEL_CACHE_MAX_ENTRIES:-256}
      GENAI_MODEL_CACHE_MAX_BYTES: ${GENAI_MODEL_CACHE_MAX_BYTES:-4194304}
    command: ["uvicorn", "app.gold_runtime:create_gold_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gold-loader:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${GOLD_LOADER_DATABASE_URL:?Configure a credencial exclusiva de carga em .env.gold-v2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${GOLD_CSV_V2_HOST_DIR:?Configure GOLD_CSV_V2_HOST_DIR in .env.gold-v2}
        target: /gold-input
        read_only: true
    command:
      - /bin/sh
      - -ec
      - >-
        alembic upgrade head &&
        python scripts/load_gold.py
        --directory /gold-input
        --schema-version gold-csv-v2
    restart: "no"

  backend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ANALYTICS_SOURCE: gold
    depends_on:
      gold-loader:
        condition: service_completed_successfully
